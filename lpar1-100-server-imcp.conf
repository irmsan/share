# output to journal
module(load="omjournal")
template(name="journal" type="list") {
    # can add other metadata here
#    property(outname="PRIORITY" name="pri")
    property(outname="SYSLOG_FACILITY" name="syslogfacility")
    property(outname="SYSLOG_IDENTIFIER" name="app-name")
    property(outname="HOSTNAME" name="hostname")
    property(outname="MESSAGE"  name="msg")
}

ruleset(name="journal-output") {
    if ($app-name == 'verify-disk-encryption') or \
           ($app-name startswith 'systemd') then {
                stop
    }
    if ($msg contains "Vault Core pubKeySig") or ($msg contains "signedPayload")  then {
            action(type="omfile" dirCreateMode="0766" FileCreateMode="0644" file="/var/log/vaultregistration.log")
    } else {
        action(type="omfile" dirCreateMode="0766" FileCreateMode="0644" file="/var/log/OSO_PLUGIN.log")
        action(type="omjournal" template="journal")
    }
}

# make gtls driver the default and set certificate files
$DefaultNetstreamDriver "gtls"
$DefaultNetstreamDriverCAFile /logging/lpar1-ca.crt
$DefaultNetstreamDriverCertFile /logging/lpar1-logging-server.crt
$DefaultNetstreamDriverKeyFile /logging/lpar1-logging-server-key.pem

# load TCP listener
module(
    load="imtcp"
    StreamDriver.Name="gtls"
    StreamDriver.Mode="1"
    KeepAlive="on"
    StreamDriver.Authmode="x509/certvalid"
)

# start up listener at port 6514
input(
    type="imtcp"
    port="6514"
    address="192.168.0.1"
    ruleset="journal-output"
    KeepAlive="on"
)
