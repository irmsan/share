# output to journal
module(load="omjournal")

template(name="journal" type="list") {
    # can add other metadata here
    # property(outname="PRIORITY" name="pri")
    property(outname="SYSLOG_FACILITY" name="syslogfacility")
    property(outname="SYSLOG_IDENTIFIER" name="app-name")
    property(outname="HOSTNAME" name="hostname")
    property(outname="MESSAGE" name="msg")
}

ruleset(name="journal-output") {
    action(type="omjournal" template="journal")

    action(type="omfwd" target="192.168.0.1" port="6514" protocol="tcp"
        StreamDriverMode="1"
        streamdriver="gtls"
        StreamDriverAuthMode="x509/certvalid"
        StreamDriver.CertFile="/logging/lpar1-client.crt"
        StreamDriver.KeyFile="/logging/lpar1-client-key.pem"
        StreamDriver.CAFile="/logging/lpar1-logging-server.crt"
        queue.type="linkedlist"
        queue.filename="ToLPAR1"
        action.resumeRetryCount="-1"
        queue.saveOnShutdown="on"
        KeepAlive="on"
        queue.checkpointInterval="5"
        queue.workerThreads="2"
    )
}

# make gtls driver the default and set certificate files
$DefaultNetstreamDriver "gtls"
$DefaultNetstreamDriverCAFile /logging/lpar2-ca.crt
$DefaultNetstreamDriverCertFile /logging/lpar2-logging-server.crt
$DefaultNetstreamDriverKeyFile /logging/lpar2-logging-server-key.pem

# load TCP listener
module(
    load="imtcp"
    StreamDriver.Name="gtls"
    StreamDriver.Mode="1"
    StreamDriver.Authmode="x509/certvalid"
)

# start up listener at port 6514
input(
    type="imtcp"
    port="6514"
    ruleset="journal-output"
)
