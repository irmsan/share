# Load module to output logs to systemd's journal
module(
    load="omjournal"
)

# Define a template for the journal output (used for local logs)
template(name="journal" type="list") {
    property(outname="SYSLOG_FACILITY" name="syslogfacility")
    property(outname="SYSLOG_IDENTIFIER" name="app-name")
    property(outname="HOSTNAME" name="hostname")
    property(outname="MESSAGE" name="msg")
}

# Ruleset for processing logs: first action writes to the local journal, second forwards to server2
ruleset(name="journal-output") {
    # Action to write logs to the local systemd journal (applies the "journal" template)
    action(type="omjournal" template="journal")

    # Action to forward logs to server2 via TLS (no template needed for forwarding, uses default syslog format)
    action(
        type="omfwd"
        target="192.168.64.2"
        port="6514"
        protocol="tcp"
        StreamDriverMode="1"
        streamdriver="gtls"
        StreamDriverAuthMode="x509/certvalid"
        StreamDriver.CertFile="/logging/lpar2-client.crt"
        StreamDriver.KeyFile="/logging/lpar2-client-key.pem"
        StreamDriver.CAFile="/logging/lpar2-logging-server.crt"
        queue.type="linkedlist"
        queue.filename="ToLPAR2"
        action.resumeRetryCount="-1"
        queue.saveOnShutdown="on"
    )
}

# Make GTLS the default driver for encrypted forwarding
$DefaultNetstreamDriver "gtls"
$DefaultNetstreamDriverCAFile /logging/lpar3-ca.crt
$DefaultNetstreamDriverCertFile /logging/lpar3-logging-server.crt
$DefaultNetstreamDriverKeyFile /logging/lpar3-logging-server-key.pem

# Load TCP listener module with GTLS for secure log forwarding
module(
    load="imtcp"
    StreamDriver.Name="gtls"
    StreamDriver.Mode="1"
    StreamDriver.Authmode="x509/certvalid"
)

# Start up the TCP listener on port 6514 (accepts incoming logs from other servers)
input(
    type="imtcp"
    port="6514"
    ruleset="journal-output"  # Uses the "journal-output" ruleset for processing logs
)
